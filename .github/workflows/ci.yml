name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Przywrócenie pakietów
        run: dotnet restore PelnaKsiegowosc.sln
      - name: Kompilacja
        run: dotnet build PelnaKsiegowosc.sln -c Release --no-restore
      - name: Testy
        run: dotnet test PelnaKsiegowosc.sln -c Release --no-build --logger "trx;LogFileName=wyniki.trx"
      - name: Wyniki testów
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wyniki-testow-${{ matrix.os }}
          path: '**/TestResults/*.trx'
