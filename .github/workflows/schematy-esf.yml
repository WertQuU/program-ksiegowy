name: Schematy e-Sprawozdań

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/fetch-esf.py'
      - '.github/workflows/schematy-esf.yml'

permissions:
  contents: read

concurrency:
  group: schematy-esf
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Narzędzia
        run: sudo apt-get install -y poppler-utils >/dev/null
      - name: Pobranie
        timeout-minutes: 10
        run: python3 tools/fetch-esf.py schemas/MF/esf2
      - name: Raport zmian do ręcznego przeglądu
        run: git diff --stat -- "schemas/MF/esf2/"
      - name: Archiwum schematów do oceny przed integracją
        uses: actions/upload-artifact@v4
        with:
          name: schematy-e-sprawozdania
          path: schemas/MF/esf2/
          if-no-files-found: error
          retention-days: 14
