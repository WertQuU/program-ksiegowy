name: Schematy e-Deklaracji

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/fetch-edek.py'
      - '.github/workflows/schematy-edek.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: schematy-edek
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pobranie
        timeout-minutes: 12
        run: python3 tools/fetch-edek.py schemas/MF/edek
      - name: Utwórz PR zamiast modyfikować main bez przeglądu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "schemas/MF/edek"
          if git diff --cached --quiet; then echo "Bez zmian"; exit 0; fi
          branch="schema-updates/e-deklaracje-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git commit -m "Aktualizacja schematów e-Deklaracji — do weryfikacji"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
            --title "Aktualizacja schematów e-Deklaracji (kontrola zmian)" \
            --body "Automatycznie pobrane schematy wymagają przeglądu pochodzenia, sum kontrolnych i zgodności z MF przed scaleniem do main."
