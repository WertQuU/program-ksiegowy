name: Schematy XSD

# Pobiera oficjalne schematy XSD MF (środowisko budowania programu nie ma dostępu do serwerów MF)
# i zapisuje je w repozytorium w katalogu schemas/MF.
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/fetch-schemas.py'
      - '.github/workflows/schematy.yml'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Narzędzia
        run: sudo apt-get install -y poppler-utils >/dev/null
      - name: Pobranie schematów
        timeout-minutes: 25
        run: python3 tools/fetch-schemas.py schemas/MF
      - name: Raport zmian do ręcznego przeglądu
        run: git diff --stat -- "schemas/MF/"
      - name: Archiwum schematów do oceny przed integracją
        uses: actions/upload-artifact@v4
        with:
          name: schematy-xsd-mf
          path: schemas/MF/
          if-no-files-found: error
          retention-days: 14
