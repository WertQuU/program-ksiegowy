name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      wydanie:
        description: 'Wersja do wydania (np. 1.0.0) — pusta: tylko testy i pakiety'
        required: false
        default: ''
      usun_wydanie:
        description: 'Tag starego wydania do usunięcia razem z tagiem (np. v1.0.0) — puste: nic nie usuwa'
        required: false
        default: ''

# Jeden aktywny przebieg na gałąź (push i PR). Starsze uruchomienia
# po kolejnych poprawkach są nieaktualne i nie powinny blokować weryfikacji.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  AVALONIA_TELEMETRY_OPTOUT: '1'

jobs:
  delete-release:
    name: Usunięcie starego wydania
    if: github.event_name == 'workflow_dispatch' && inputs.usun_wydanie != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Usuń wydanie i tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.usun_wydanie }}
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes

  test:
    name: Testy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: PostgreSQL do testów integracyjnych (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # windows-latest zawiera PostgreSQL; usługa jest domyślnie wyłączona.
          # Wykrywanie nazwy usługi zamiast przywiązania do wersji serwera.
          $service = Get-Service -Name 'postgresql-x64-*' -ErrorAction Stop |
            Select-Object -First 1
          if (-not $service) { throw 'Brak usługi PostgreSQL na obrazie Windows.' }
          Set-Service -Name $service.Name -StartupType Manual
          Start-Service -Name $service.Name
          $pgIsReady = Join-Path $env:PGBIN 'pg_isready.exe'
          $psql = Join-Path $env:PGBIN 'psql.exe'
          if (-not (Test-Path $psql)) { throw 'Brak narzędzia psql.exe na obrazie Windows.' }
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            & $pgIsReady -h 127.0.0.1 -p 5432 | Out-Null
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) { throw 'PostgreSQL na Windows nie rozpoczął nasłuchiwania.' }
          # Dane testowe dostarczane przez obraz GitHub Actions, nigdy produkcyjne.
          $env:PGPASSWORD = 'root'
          & $psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE USER pk WITH PASSWORD 'pk_test_pw' CREATEDB CREATEROLE;"
          if ($LASTEXITCODE -ne 0) { throw 'Nie udało się utworzyć testowej roli PostgreSQL.' }
          Remove-Item Env:\PGPASSWORD
          "PK_TEST_PG=Host=127.0.0.1;Username=pk;Password=pk_test_pw;Database=postgres" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: PostgreSQL i atrapa S3 do testów integracyjnych (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo systemctl start postgresql.service
          # Test kreatora tworzy osobny login operatora z ograniczonymi prawami.
          sudo -u postgres psql -c "CREATE USER pk WITH PASSWORD 'pk_test_pw' CREATEDB CREATEROLE;"
          python3 -m venv "$RUNNER_TEMP/moto"
          "$RUNNER_TEMP/moto/bin/pip" install --quiet "moto[server]"
          nohup "$RUNNER_TEMP/moto/bin/python" -m moto.server -H 127.0.0.1 -p 5055 > moto.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:5055 && break; sleep 1; done
          curl -s -o /dev/null http://127.0.0.1:5055 || { cat moto.log; exit 1; }
          echo "PK_TEST_PG=Host=127.0.0.1;Username=pk;Password=pk_test_pw;Database=postgres" >> "$GITHUB_ENV"
          echo "PK_TEST_S3_ENDPOINT=http://127.0.0.1:5055" >> "$GITHUB_ENV"
      - name: SQL preflight operatora — test rzeczywisty (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Osobna testowa baza i login bez praw administracyjnych.
          sudo -u postgres createdb pk_preflight_ci
          sudo -u postgres psql -d pk_preflight_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE pk_preflight_operator LOGIN INHERIT PASSWORD 'pk_preflight_ci_pw';
          CREATE ROLE pk_preflight_inherited NOLOGIN;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          CREATE TABLE public."AuditEvents" ("Id" integer PRIMARY KEY);
          GRANT USAGE ON SCHEMA public TO pk_preflight_operator;
          GRANT SELECT, INSERT ON TABLE public."AuditEvents" TO pk_preflight_operator;
          SQL
          export PGPASSWORD=pk_preflight_ci_pw
          # Pozytywny przypadek: operator może czytać i dopisywać audyt,
          # ale nie ma praw właściciela ani UPDATE/DELETE.
          psql -h 127.0.0.1 -U pk_preflight_operator -d pk_preflight_ci -v ON_ERROR_STOP=1 \
            -f scripts/postgres-operator-preflight.sql

          # Negatywny przypadek: bezpośredni grant UPDATE musi zostać wykryty.
          sudo -u postgres psql -d pk_preflight_ci -v ON_ERROR_STOP=1 \
            -c 'GRANT UPDATE ON public."AuditEvents" TO pk_preflight_operator'
          if psql -h 127.0.0.1 -U pk_preflight_operator -d pk_preflight_ci -v ON_ERROR_STOP=1 \
            -f scripts/postgres-operator-preflight.sql > "$RUNNER_TEMP/preflight-update.log" 2>&1; then
            echo "BŁĄD: preflight zaakceptował operatora z UPDATE na AuditEvents"; exit 1
          fi
          grep -q 'AuditEvents' "$RUNNER_TEMP/preflight-update.log"
          sudo -u postgres psql -d pk_preflight_ci -v ON_ERROR_STOP=1 \
            -c 'REVOKE UPDATE ON public."AuditEvents" FROM pk_preflight_operator'

          # Negatywny przypadek: DELETE odziedziczony z innej roli.
          sudo -u postgres psql -d pk_preflight_ci -v ON_ERROR_STOP=1 <<'SQL'
          GRANT DELETE ON public."AuditEvents" TO pk_preflight_inherited;
          GRANT pk_preflight_inherited TO pk_preflight_operator;
          SQL
          if psql -h 127.0.0.1 -U pk_preflight_operator -d pk_preflight_ci -v ON_ERROR_STOP=1 \
            -f scripts/postgres-operator-preflight.sql > "$RUNNER_TEMP/preflight-inherited.log" 2>&1; then
            echo "BŁĄD: preflight zaakceptował odziedziczone DELETE na AuditEvents"; exit 1
          fi
          grep -q 'AuditEvents' "$RUNNER_TEMP/preflight-inherited.log"

          # Negatywny przypadek: konto z CREATEDB/CREATEROLE nie jest operatorem.
          if PGPASSWORD=pk_test_pw psql -h 127.0.0.1 -U pk -d pk_preflight_ci -v ON_ERROR_STOP=1 \
            -f scripts/postgres-operator-preflight.sql > "$RUNNER_TEMP/preflight-admin.log" 2>&1; then
            echo "BŁĄD: preflight zaakceptował konto administracyjne"; exit 1
          fi
          grep -Eq 'CREATEDB|CREATEROLE' "$RUNNER_TEMP/preflight-admin.log"
      - name: Przywrócenie pakietów
        run: dotnet restore PelnaKsiegowosc.sln
      - name: Kompilacja
        run: dotnet build PelnaKsiegowosc.sln -c Release --no-restore
      - name: Testy
        run: dotnet test PelnaKsiegowosc.sln -c Release --no-build --blame-hang --blame-hang-timeout 12m --blame-hang-dump-type none --logger "trx;LogFileName=wyniki.trx" --logger "console;verbosity=normal"
      - name: Bramka regresyjna — bez pominiętych testów PostgreSQL na Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -Path . -Recurse -Filter wyniki.trx |
            Where-Object { $_.FullName -match 'TestResults' })
          if ($files.Count -eq 0) { throw 'Brak raportu TRX — nie można potwierdzić wykonania testów.' }
          foreach ($file in $files) {
            [xml]$trx = Get-Content -Path $file.FullName -Raw
            $ns = [System.Xml.XmlNamespaceManager]::new($trx.NameTable)
            $ns.AddNamespace('t', 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010')
            $counts = $trx.SelectSingleNode('//t:ResultSummary/t:Counters', $ns)
            if (-not $counts) { throw "Brak liczników testów w $($file.FullName)" }
            $skipped = [int]$counts.GetAttribute('notExecuted')
            Write-Host "$($file.Name): pominięte=$skipped"
            if ($skipped -ne 0) {
              throw "Pominięto $skipped testów na Windows; sprawdź PK_TEST_PG i zależności."
            }
          }
      - name: Wyniki testów
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wyniki-testow-${{ matrix.os }}
          path: '**/TestResults/*.trx'

  linux:
    name: Pakiety Linux (tar.gz, deb)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Wersja
        run: |
          if [ -n "${{ inputs.wydanie }}" ]; then echo "VERSION=${{ inputs.wydanie }}" >> "$GITHUB_ENV";
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; else echo "VERSION=1.0.0" >> "$GITHUB_ENV"; fi
      - name: Publikacja (self-contained linux-x64)
        run: |
          dotnet publish src/PelnaKsiegowosc.App/PelnaKsiegowosc.App.csproj -c Release -r linux-x64 --self-contained true -p:Version=$VERSION -o artifacts/linux-x64
          dotnet publish src/PelnaKsiegowosc.Cli/PelnaKsiegowosc.Cli.csproj -c Release -r linux-x64 --self-contained true -p:Version=$VERSION -o artifacts/linux-x64
      - name: Kontrola uruchomienia opublikowanego programu
        run: artifacts/linux-x64/PelnaKsiegowosc --test-uruchomienia
      - name: Pakiety
        run: packaging/linux/build-packages.sh artifacts/linux-x64 "$VERSION" artifacts/packages
      - name: Test instalacji pakietu deb
        run: |
          sudo apt-get install -y ./artifacts/packages/pelnaksiegowosc_${VERSION}_amd64.deb
          pelnaksiegowosc --test-uruchomienia
          pk-cli pomoc
      - uses: actions/upload-artifact@v4
        with:
          name: PelnaKsiegowosc-linux
          path: artifacts/packages/*

  windows:
    name: Pakiety Windows (MSI, zip)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Wersja
        shell: pwsh
        run: |
          $v = if ('${{ inputs.wydanie }}' -ne '') { '${{ inputs.wydanie }}' } elseif ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '1.0.0' }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publikacja (self-contained win-x64)
        shell: pwsh
        run: |
          dotnet publish src/PelnaKsiegowosc.App/PelnaKsiegowosc.App.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:VERSION -o artifacts/win-x64
          dotnet publish src/PelnaKsiegowosc.Cli/PelnaKsiegowosc.Cli.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:VERSION -o artifacts/win-x64
      - name: Kontrola uruchomienia opublikowanego programu
        shell: pwsh
        run: |
          $p = Start-Process -FilePath artifacts/win-x64/PelnaKsiegowosc.exe -ArgumentList '--test-uruchomienia' -Wait -PassThru -NoNewWindow -RedirectStandardOutput test.log -RedirectStandardError test.err
          Get-Content test.log, test.err
          if ($p.ExitCode -ne 0) { throw "Kontrola uruchomienia zakończona kodem $($p.ExitCode)" }
          ./artifacts/win-x64/pk-cli.exe pomoc
      - name: Pakiet przenośny (zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/packages | Out-Null
          Get-ChildItem artifacts/win-x64 -Recurse -Filter *.pdb | Remove-Item
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md artifacts/win-x64/
          Compress-Archive -Path artifacts/win-x64/* -DestinationPath "artifacts/packages/PelnaKsiegowosc-$env:VERSION-win-x64.zip"
      - name: Instalator MSI (WiX 5)
        shell: pwsh
        run: |
          dotnet build installer/PelnaKsiegowosc.Installer.wixproj -c Release -p:ProductVersion=$env:VERSION "-p:AppPublishDir=$PWD/artifacts/win-x64" -o artifacts/msi
          Copy-Item artifacts/msi/*.msi artifacts/packages/
      - name: Test instalacji MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem artifacts/packages/*.msi | Select-Object -First 1
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /qn /l*v msi.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content msi.log -Tail 50; throw "Instalacja MSI nieudana: $($p.ExitCode)" }
          $exe = Join-Path $env:ProgramFiles 'PelnaKsiegowosc\PelnaKsiegowosc.exe'
          if (-not (Test-Path $exe)) { throw "Brak zainstalowanego programu: $exe" }
          $t = Start-Process -FilePath $exe -ArgumentList '--test-uruchomienia' -Wait -PassThru -NoNewWindow -RedirectStandardOutput inst.log
          Get-Content inst.log
          if ($t.ExitCode -ne 0) { throw "Zainstalowany program nie przeszedł kontroli uruchomienia" }
          $u = Start-Process msiexec.exe -ArgumentList "/x `"$($msi.FullName)`" /qn" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Odinstalowanie nieudane: $($u.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: PelnaKsiegowosc-windows
          path: artifacts/packages/*

  release:
    name: Wydanie (tag v*)
    # Publikacja wyłącznie po świadomym uruchomieniu workflow z numerem wydania.
    if: github.event_name == 'workflow_dispatch' && inputs.wydanie != ''
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: PelnaKsiegowosc-*
          path: pakiety
          merge-multiple: true
      - name: Sumy kontrolne
        run: cd pakiety && find . -maxdepth 1 -type f -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: pakiety/*
          tag_name: ${{ inputs.wydanie != '' && format('v{0}', inputs.wydanie) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Pełna Księgowość ${{ inputs.wydanie != '' && format('v{0}', inputs.wydanie) || github.ref_name }}
          body_path: docs/wydania/${{ inputs.wydanie != '' && format('v{0}', inputs.wydanie) || github.ref_name }}.md
          generate_release_notes: true
