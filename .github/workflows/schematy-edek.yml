name: Schematy e-Deklaracji

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/fetch-edek.py'
      - '.github/workflows/schematy-edek.yml'

permissions:
  contents: read

concurrency:
  group: schematy-edek
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pobranie
        timeout-minutes: 12
        run: python3 tools/fetch-edek.py schemas/MF/edek
      - name: Raport zmian do ręcznego przeglądu
        run: git diff --stat -- "schemas/MF/edek/"
      - name: Archiwum schematów do oceny przed integracją
        uses: actions/upload-artifact@v4
        with:
          name: schematy-e-deklaracje
          path: schemas/MF/edek/
          if-no-files-found: error
          retention-days: 14
