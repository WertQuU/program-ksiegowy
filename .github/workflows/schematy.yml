name: Schematy XSD

# Pobiera oficjalne schematy XSD MF (środowisko budowania programu nie ma dostępu do serwerów MF)
# i zapisuje je w repozytorium w katalogu schemas/MF.
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/fetch-schemas.py'
      - '.github/workflows/schematy.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Narzędzia
        run: sudo apt-get install -y poppler-utils >/dev/null
      - name: Pobranie schematów
        timeout-minutes: 25
        run: python3 tools/fetch-schemas.py schemas/MF
      - name: Utwórz PR zamiast modyfikować main bez przeglądu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "schemas/MF"
          if git diff --cached --quiet; then echo "Bez zmian"; exit 0; fi
          branch="schema-updates/xsd-mf-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git commit -m "Aktualizacja schematów XSD MF — do weryfikacji"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
            --title "Aktualizacja schematów XSD MF (kontrola zmian)" \
            --body "Automatycznie pobrane schematy wymagają przeglądu pochodzenia, sum kontrolnych i zgodności z MF przed scaleniem do main."
