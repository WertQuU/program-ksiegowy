name: Remove old development releases
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-old-releases.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove releases requested by repository owner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[].id' > "$RUNNER_TEMP/release-ids"
          while IFS= read -r release_id; do
            [ -n "$release_id" ] || continue
            gh api --method DELETE "repos/$GH_REPO/releases/$release_id"
            echo "Removed release ID $release_id"
          done < "$RUNNER_TEMP/release-ids"
          remaining=$(gh api "repos/$GH_REPO/releases?per_page=1" --jq 'length')
          test "$remaining" = 0
